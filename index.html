<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#176B4D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Studora" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/studora-favicon.svg" />
    <meta name="description" content="Studora is an all-in-one academic platform for managing your CGPA, planning your studies, preparing for tests, learning with AI, and connecting with tutors." />
    <meta property="og:title" content="Studora — Study smarter. Go further." />
    <meta property="og:description" content="Studora helps you plan your semester, track your academic progress, prepare for tests, learn with AI, and connect with tutors — all in one academic platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Studora — Study smarter. Go further." />
    <meta name="twitter:description" content="Studora helps you plan your semester, track your academic progress, prepare for tests, learn with AI, and connect with tutors — all in one academic platform." />
    <title>Studora — Study smarter. Go further.</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('studora-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) document.documentElement.classList.add('dark');
      } catch (_) {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      .dark #initial-splash { background: #0a1510 !important; }
      .dark #initial-splash .splash-title { color: #f0fdf4 !important; }
      .dark #initial-splash .splash-subtitle { color: #a4b2a9 !important; }
    </style>
    <!-- Preload Self-Hosted Primary Font -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body class="bg-[#F6F7F3] text-[#111827] antialiased selection:bg-[#DDEFE5] selection:text-[#176B4D] overflow-x-clip min-h-screen">
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F6F7F3;z-index:99999;font-family:'Manrope',-apple-system,sans-serif;padding:24px;">
        <img src="/icons/studora-192.png" width="80" height="80" alt="" style="display:block;border-radius:22px;box-shadow:0 12px 28px rgba(23,107,77,0.24);" />
        <div style="margin-top:22px;text-align:center;">
          <div class="splash-title" style="font-weight:800;font-size:22px;color:#111827;letter-spacing:-0.02em;">Studora</div>
          <div class="splash-subtitle" style="font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;color:#667085;margin-top:4px;font-weight:700;">Study smarter. Go further.</div>
        </div>
        <div style="font-size:12px;color:#667085;margin-top:14px;font-weight:500;">Loading Studora…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
